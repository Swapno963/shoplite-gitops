apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
spec:
  project: shoplite
  sources:
    - repoURL: https://github.com/Swapno963/shoplite-app.git
      targetRevision: main
      path: helm/shoplite
      helm:
        releaseName: shoplite
        valueFiles:
          - $values/envs/prod/values.yaml
    - repoURL: https://github.com/Swapno963/shoplite-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

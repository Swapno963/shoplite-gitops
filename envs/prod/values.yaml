namespace: shoplite-prod

ingress:
  # Empty = any Host, including the AWS ALB DNS name.
  host: ""

web:
  replicaCount: 2
  image:
    tag: stable

catalogApi:
  replicaCount: 3
  image:
    tag: stable

orderWorker:
  replicaCount: 1
  image:
    tag: stable
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

postgres:
  storage: 100Gi

applicationConfig:
  DJANGO_DEBUG: "false"
  ALLOWED_HOSTS: "*"
  LOG_LEVEL: "INFO"
  CHAOS_ERROR_RATE: "0.5"

secrets:
  existingSecret: shoplite-secret
